
name: Build SkillTree

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: gradle build --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkillTree-${{ github.run_number }}-JAR
          path: build/libs/*.jar
          if-no-files-found: error
